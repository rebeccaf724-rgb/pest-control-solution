name = "pest-ads-monitor"
main = "src.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "pest-ads-monitor"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGIN = "https://YOURUSERNAME.github.io"
AUTO_EXCLUDE = "false"
DRY_RUN = "true"
MAX_EXCLUSIONS_PER_DAY = "5"
# Never put passwords, refresh tokens, or API credentials in this file.
