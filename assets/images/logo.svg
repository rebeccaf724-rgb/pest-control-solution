    <path d="M18 26 C22 28, 28 27, 34 22 C30 31, 24 38, 20 42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="26" cy="18" r="2.5" fill="#ffffff"/>
  </g>
  <!-- Typography -->
  <g transform="translate(68, 0)">
    <text x="0" y="27" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#0B3A6B" letter-spacing="-0.4">GREEN PEST</text>
    <text x="133" y="27" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1A6B35" letter-spacing="-0.4">.</text>
    <text x="0" y="44" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="9.5" fill="#1A6B35" letter-spacing="1.8">MANAGEMENT SOLUTION</text>
    <text x="0" y="56" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="500" font-size="8" fill="#5A6570" letter-spacing="0.8">HYDERABAD · SAFE &amp; CERTIFIED</text>
  </g>
