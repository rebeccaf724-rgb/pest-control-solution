<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logo-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#248a46"/>
      <stop offset="100%" stop-color="#145528"/>
    </linearGradient>
    <linearGradient id="logo-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4882"/>
      <stop offset="100%" stop-color="#0B3A6B"/>
    </linearGradient>
  </defs>
  <!-- Shield & Leaf Emblem -->
  <g transform="translate(6, 6)">
    <!-- Shield Outline/Back -->
    <path d="M26 2 C37 2, 48 8, 50 14 C50 32, 38 46, 26 50 C14 46, 2 32, 2 14 C4 8, 15 2, 26 2 Z" fill="url(#logo-shield)"/>
    <!-- Leaf in Shield -->
